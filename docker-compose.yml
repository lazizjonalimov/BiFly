# Local development.
#
#   docker compose up -d                      -> PostgreSQL only (run the API and web app on your machine)
#   docker compose --profile app up --build   -> the whole stack in containers
#
# The passwords below are development defaults. Never reuse them outside your own machine.
name: bifly

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev}
      BIFLY_OWNER_PASSWORD: ${BIFLY_OWNER_PASSWORD:-bifly_owner_dev}
      BIFLY_APP_PASSWORD: ${BIFLY_APP_PASSWORD:-bifly_app_dev}
    ports:
      - "${BIFLY_DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sh:/docker-entrypoint-initdb.d/10-bifly.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bifly"]
      interval: 3s
      timeout: 3s
      retries: 20

  # One-shot: applies migrations as the schema owner, then exits. The API never gets these credentials.
  migrate:
    profiles: ["app"]
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment:
      BIFLY_MIGRATION_DATABASE_URL: postgresql+psycopg://bifly_owner:${BIFLY_OWNER_PASSWORD:-bifly_owner_dev}@db:5432/bifly
    depends_on:
      db:
        condition: service_healthy

  api:
    profiles: ["app"]
    build: ./backend
    environment:
      BIFLY_ENV: development
      BIFLY_DATABASE_URL: postgresql+psycopg://bifly_app:${BIFLY_APP_PASSWORD:-bifly_app_dev}@db:5432/bifly
      BIFLY_JWT_SECRET: ${BIFLY_JWT_SECRET:-dev-only-change-me-dev-only-change-me}
    ports:
      - "8000:8000"
    volumes:
      - documents:/data/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    profiles: ["app"]
    build: ./apps/web
    environment:
      BIFLY_API_URL: http://api:8000
      # Set to "true" only to view the app inside another site's frame (hosted preview panes). Never in production.
      BIFLY_ALLOW_EMBEDDING: ${BIFLY_ALLOW_EMBEDDING:-false}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
  documents:
