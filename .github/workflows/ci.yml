name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Used by infrastructure/docker/postgres/init.sh to create the two database roles on the service container.
  # Throwaway credentials for an ephemeral CI database.
  POSTGRES_USER: postgres
  PGHOST: localhost
  PGPASSWORD: postgres
  BIFLY_OWNER_PASSWORD: bifly_owner_dev
  BIFLY_APP_PASSWORD: bifly_app_dev

jobs:
  backend:
    name: Backend (lint, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests alembic scripts
      - name: Create database roles
        run: sh ../infrastructure/docker/postgres/init.sh
      - name: Migrations match the models
        run: alembic upgrade head && alembic check
      - name: Tests
        run: python -m pytest

  web:
    name: Web (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  # Boots the real stack the way production runs it (migrations as the owner, the API as the restricted role)
  # and drives it over HTTP with the demo script, which touches every module. The browser journeys return
  # here when the rebuilt web application lands.
  smoke:
    name: API smoke test (real server)
    needs: [backend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Database and API
        run: |
          sh ../infrastructure/docker/postgres/init.sh
          pip install -r requirements-dev.txt
          alembic upgrade head
          nohup uvicorn app.main:app --port 8000 > ../api.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://localhost:8000/healthz && break || sleep 2; done
          curl -fsS -o /dev/null http://localhost:8000/healthz
      - name: Build a demo account through the API
        run: python scripts/seed_demo.py
      - name: The contract is served
        run: curl -fsS http://localhost:8000/api/openapi.json | python -c "import json, sys; print(len(json.load(sys.stdin)['paths']), 'paths')"
      - name: Keep the API log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-log
          path: api.log
          retention-days: 7
