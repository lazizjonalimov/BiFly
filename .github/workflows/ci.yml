name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Used by infrastructure/docker/postgres/init.sh to create the two database roles on the service container.
  # Throwaway credentials for an ephemeral CI database.
  POSTGRES_USER: postgres
  PGHOST: localhost
  PGPASSWORD: postgres
  BIFLY_OWNER_PASSWORD: bifly_owner_dev
  BIFLY_APP_PASSWORD: bifly_app_dev

jobs:
  backend:
    name: Backend (lint, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests alembic scripts
      - name: The published API contract is current
        run: python scripts/export_openapi.py --check
      - name: Create database roles
        run: sh ../infrastructure/docker/postgres/init.sh
      - name: Migrations match the models
        run: alembic upgrade head && alembic check
      - name: Tests
        run: python -m pytest

  web:
    name: Web (lint, types, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Types are generated from the current API contract
        run: npm run api:types && git diff --exit-code -- src/lib/api/schema.d.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Boots the real stack the way production runs it (migrations as the owner, the API as the restricted
  # role, a production build of the web app) and drives it: first over HTTP with the demo script, which
  # touches every module, then in a real browser.
  e2e:
    name: End-to-end (real server, real browser)
    needs: [backend, web]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Database and API
        working-directory: backend
        run: |
          sh ../infrastructure/docker/postgres/init.sh
          pip install -r requirements-dev.txt
          alembic upgrade head
          nohup uvicorn app.main:app --port 8000 > ../api.log 2>&1 &
      - name: Web app
        working-directory: apps/web
        run: |
          npm ci
          npm run build
          nohup npm run start > ../../web.log 2>&1 &
      - name: Wait for the stack
        run: |
          for url in http://localhost:8000/healthz http://localhost:3000/login; do
            for i in $(seq 1 30); do curl -fsS -o /dev/null "$url" && break || sleep 2; done
            curl -fsS -o /dev/null "$url"
          done
      - name: Demo data builds through the API
        working-directory: backend
        run: python scripts/seed_demo.py
      - name: Browser journeys
        working-directory: apps/web
        run: |
          npx playwright install --with-deps chromium
          npm run e2e -- --trace off
      - name: Keep logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure
          path: |
            api.log
            web.log
            apps/web/test-results/
          retention-days: 7
